name: Lint & Security Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tools
        run: pip install ruff detect-secrets

      - name: Ruff lint check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Detect secrets
        run: detect-secrets scan --exclude-files '^(Sources/|datasets/|chunks/|logs/)' --baseline .secrets.baseline
