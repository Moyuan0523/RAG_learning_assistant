[project]
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120

exclude = [
    "Sources",
    "chunks",
    "datasets",
    "logs",
    "building_note",
    "testing",
    "evaluation_reports",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # use of assert (ok in tests)
    "S603",  # subprocess call - check for untrusted input
    "S607",  # starting a process with a partial path
]

[tool.ruff.lint.per-file-ignores]
"evaluate/*" = ["S"]  # relax security rules for eval scripts

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
